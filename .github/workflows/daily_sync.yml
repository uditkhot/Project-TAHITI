name: Daily Health Sync
on:
  schedule:
    - cron: '30 1 * * *' # Triggers daily at 7:00 AM IST
  workflow_dispatch:     # Manual override button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Removed the cache parameter to stop the runner from looking for a requirements.txt file

      - name: Install Google Dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Execute Sync Engine
        env:
          GOOGLE_TASKS_TOKEN: ${{ secrets.GOOGLE_TASKS_TOKEN }}
        run: python sync_health.py
