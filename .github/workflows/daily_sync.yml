name: Daily Health & Issues Sync
on:
  schedule:
   # - cron: '30 23 * * *' # Triggers daily at 5:00 AM IST
  workflow_dispatch:     # Manual override button

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write # Grants full security authority to interact with your Issue list

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
          pip install google-genai

      - name: Step 1 - Process Ingested Issues & Photos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Handled automatically by GitHub
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyze_meal.py

      - name: Step 2 - Deploy Dynamic Daily Task Matrix
        env:
          GOOGLE_TASKS_TOKEN: ${{ secrets.GOOGLE_TASKS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sync_health.py

      - name: Step 3 - Commit History Updates to Repository
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add meal_history.json inventory_note.txt
          git diff-index --quiet HEAD || git commit -m "JARVIS: Automated history log updates [skip ci]"
          git push