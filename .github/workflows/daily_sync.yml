name: Daily Health & Vision Sync
on:
  schedule:
    - cron: '30 23 * * *' # Triggers at exactly 11:30 PM UTC (5:00 AM IST)
  workflow_dispatch:     # Manual override button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
          pip install google-genai

      - name: Step 1 - Process Pending Meal Snapshots
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyze_meal.py

      - name: Step 2 - Deploy Dynamic Daily Task Matrix
        env:
          GOOGLE_TASKS_TOKEN: ${{ secrets.GOOGLE_TASKS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sync_health.py

      - name: Step 3 - Commit History Updates to Repository
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add meal_history.json
          git diff-index --quiet HEAD || git commit -m "JARVIS: Automated history log updates [skip ci]"
          git push
